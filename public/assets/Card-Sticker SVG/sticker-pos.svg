<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 135 130" fill="none">
  <!-- Die-cut outer white sticker border/backing -->
  <path d="M26 18 C46 10, 84 10, 106 20 C124 30, 130 52, 127 76 C124 100, 110 120, 86 125 C62 130, 30 126, 17 108 C4 90, 6 66, 10 44 C14 28, 18 22, 26 18 Z"
        fill="#FFFFFF" stroke="#E2DEC9" stroke-width="4" stroke-linejoin="round" />
  
  <!-- Sticker Body (Warm Cream / Butter Pastel Yellow) -->
  <path d="M28 21 C47 13, 82 13, 103 23 C120 32, 126 53, 123 75 C120 97, 107 116, 84 121 C62 125, 32 121, 20 104 C8 87, 10 64, 14 43 C18 29, 21 24, 28 21 Z"
        fill="#FFF2A8" />

  <!-- A subtle inner shadow fold -->
  <path d="M25 98 C45 116, 78 118, 105 106" 
        stroke="#E6D380" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- POS Terminal & Receipt Artwork -->
  <g transform="translate(22, 22)">
    <!-- POS Terminal Body -->
    <rect x="14" y="24" width="56" height="42" rx="8" fill="#2A1B28" stroke="#160E16" stroke-width="2.5"/>
    
    <!-- Screen -->
    <rect x="19" y="29" width="46" height="25" rx="4" fill="#3D293A"/>
    
    <!-- Screen graphic: Cart item & Green Checkmark -->
    <rect x="23" y="34" width="14" height="4" rx="2" fill="#FFE57F"/>
    <rect x="23" y="41" width="20" height="4" rx="2" fill="#FFFFFF" opacity="0.6"/>
    <circle cx="56" cy="41" r="5" fill="#44D7B6"/>
    <path d="M54 41 L55.5 42.5 L58.5 39.5" stroke="#160E16" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Terminal Stand Base -->
    <path d="M34 66 L50 66 L54 74 L30 74 Z" fill="#160E16"/>

    <!-- Thermal Paper Receipt rolling out with zigzag cut edge -->
    <path d="M42 24 L42 8 Q46 6 50 8 Q54 10 58 8 L58 24 Z" 
          fill="#FFFFFF" stroke="#160E16" stroke-width="2"/>
    <!-- Lines of text on receipt -->
    <line x1="45" y1="12" x2="55" y2="12" stroke="#B0A8B9" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="45" y1="16" x2="52" y2="16" stroke="#B0A8B9" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Speed Lightning Bolt ⚡ on the right -->
    <g transform="translate(56, 12) rotate(10)">
      <polygon points="12,0 3,16 11,16 5,30 20,12 12,12" fill="#FF5E36" stroke="#160E16" stroke-width="2" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Speed Dots & Sparkles -->
  <path d="M22 35 Q25 38 28 35 Q25 32 22 35 Z" fill="#FF5E36"/>
  <circle cx="112" cy="70" r="2.5" fill="#2A1B28"/>
  <circle cx="20" cy="76" r="2" fill="#2A1B28"/>
</svg>
