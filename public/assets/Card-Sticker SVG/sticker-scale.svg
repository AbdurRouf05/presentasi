<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 135 130" fill="none">
  <!-- Die-cut outer white sticker border/backing -->
  <path d="M24 20 C42 8, 88 10, 110 22 C126 32, 132 54, 128 78 C124 102, 110 122, 86 126 C62 130, 30 125, 16 108 C2 92, 4 66, 8 44 C12 28, 16 24, 24 20 Z"
        fill="#FFFFFF" stroke="#E2DEC9" stroke-width="4" stroke-linejoin="round" />
  
  <!-- Sticker Body (Vibrant Acid Lime) -->
  <path d="M26 23 C43 12, 86 14, 107 25 C122 34, 127 54, 124 76 C120 98, 107 117, 84 121 C62 125, 32 120, 19 104 C6 89, 8 65, 12 44 C15 30, 19 26, 26 23 Z"
        fill="#E5F876" />

  <!-- A small doodle scale / timbangan digital -->
  <g transform="translate(22, 24)">
    <!-- Bowl / Weighing Scoop on top -->
    <path d="M20 28 C26 38, 64 38, 70 28 L74 20 C74 18, 16 18, 16 20 Z" 
          fill="#FFFFFF" stroke="#18233C" stroke-width="3" stroke-linejoin="round"/>
    
    <!-- Fine coffee / powder grounds inside scoop -->
    <path d="M24 22 Q45 28 66 22" stroke="#B89358" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="42" cy="17" r="1.5" fill="#B89358"/>
    <circle cx="48" cy="16" r="1.5" fill="#B89358"/>

    <!-- Scale Platform (Stainless top plate) -->
    <rect x="14" y="32" width="62" height="7" rx="3.5" fill="#D2E35E" stroke="#18233C" stroke-width="2.5"/>
    
    <!-- Scale Main Body Base -->
    <rect x="10" y="39" width="70" height="36" rx="9" fill="#18233C"/>

    <!-- LCD Display Screen -->
    <rect x="20" y="46" width="50" height="18" rx="4" fill="#0B1220" stroke="#486581" stroke-width="1"/>
    
    <!-- Display Reading: "0.1 g" glowing bright cyan-white -->
    <text x="45" y="59.5" font-family="'DM Sans', monospace, sans-serif" font-weight="900" font-size="12" fill="#54F2CE" text-anchor="middle" letter-spacing="1">0.1<tspan font-size="9" fill="#E5F876">g</tspan></text>
    
    <!-- Tare / Power button dots -->
    <circle cx="26" cy="69" r="2" fill="#E5F876"/>
    <circle cx="64" cy="69" r="2" fill="#F05D5E"/>
  </g>

  <!-- Precision Star Sparkles -->
  <path d="M102 32 Q105 37 110 37 Q105 37 102 42 Q102 37 97 37 Q102 37 102 32 Z" fill="#18233C"/>
  <circle cx="112" cy="52" r="2" fill="#18233C"/>
  <circle cx="20" cy="80" r="2" fill="#18233C"/>
</svg>
